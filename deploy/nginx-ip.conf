# Replace 192.0.2.10 with the public IP. Install only AFTER issuing the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name 192.0.2.10;
    root /var/www/web-bot;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 192.0.2.10;
    root /var/www/web-bot;
    index index.html;

    ssl_certificate /etc/letsencrypt-ip/live/web-bot-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/web-bot-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
